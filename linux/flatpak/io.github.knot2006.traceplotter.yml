# The Flatpak, built from this checkout. From the repository root:
#   flatpak-builder --user --install-deps-from=flathub --install build linux/flatpak/io.github.knot2006.traceplotter.yml
# The id is the one the window already gives Wayland, so the desktop finds the icon and name.
id: io.github.knot2006.traceplotter
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: traceplotter
finish-args:
  # Probing, reverse DNS, update checks and the MCP server on 127.0.0.1.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The tray icon (StatusNotifierItem) and alert notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: traceplotter
    buildsystem: simple
    build-options:
      append-path: /run/build/traceplotter/cargo/bin
      env:
        CARGO_HOME: /run/build/traceplotter/cargo
        RUSTUP_HOME: /run/build/traceplotter/rustup
      # Cargo downloads the crates itself, and rustup the toolchain, because the SDK's
      # rust-stable extension can lag behind the Rust version Cargo.toml asks for. Flathub
      # allows neither: it needs that extension and the crates listed as sources, made from
      # Cargo.lock with flatpak-cargo-generator.
      build-args:
        - --share=network
    build-commands:
      - curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
      - cargo build --release --locked
      - install -Dm755 target/release/traceplotter /app/bin/traceplotter
      - install -Dm644 icons/32x32.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 icons/icon.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 linux/flatpak/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 linux/flatpak/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - build
          - repo
          - .flatpak-builder
