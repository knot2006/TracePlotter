# Type check and tests for every push to main and every pull request, Dependabot's included.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run for the previous one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Windows first; Linux to keep the portable code building.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Debug info is never read in CI and is most of the cached target folder.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      # Actions are pinned to a commit; Dependabot proposes newer ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # The runner image already has stable Rust with clippy, updated every week or so.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          # Only main saves the cache: pull requests can read it, and saving one per
          # branch filled the 10 GB the repository gets and pushed main's out.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The backend embeds the built frontend, so that has to exist first.
      - run: npm run build
      - run: cargo clippy --lib --tests --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - run: cargo check --features legacy-migration --manifest-path src-tauri/Cargo.toml

  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      # No npm build or WebKit is needed by the native executable.
      - run: cargo clippy --lib --tests --no-default-features --features egui-ui,ui-tests --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --lib --no-default-features --features egui-ui,ui-tests --manifest-path src-tauri/Cargo.toml
      - run: cargo check --no-default-features --features egui-ui,dev-live --manifest-path src-tauri/Cargo.toml
