# Native checks for every push to main and every pull request, Dependabot's included.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request makes the run for the previous one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Windows first; Linux to keep the portable code building.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Debug info is never read in CI and is most of the cached target folder.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      # Actions are pinned to a commit; Dependabot proposes newer ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .
          # Only main saves the cache: pull requests can read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib --features ui-tests
      - if: runner.os == 'Linux'
        run: bash -n scripts/package-linux.sh
      - if: runner.os == 'Linux'
        run: bash -n scripts/package-appimage.sh
