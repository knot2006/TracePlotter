# Settings of cargo-about, which writes the licences of the crates built into the exe to
# THIRD-PARTY-LICENSES.txt for a release (see the Release workflow).
# A crate under a licence that is not listed here fails the release until it is looked at.
accepted = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
]
# Releases are built for Windows only.
targets = ["x86_64-pc-windows-msvc"]
