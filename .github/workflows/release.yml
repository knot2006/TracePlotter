# Builds, signs and publishes a release when a version tag such as v0.2.0 is pushed.
# The running app finds the release through GitHub's "latest release", downloads
# TracePlotter.exe and installs it only if TracePlotter.exe.sig matches its built-in key
# and was made for the version the release claims.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY: the contents of the private key
# made with `tauri signer generate`, whose public half is UPDATE_PUBLIC_KEY in lib.rs.
# If that key has a password, it goes in the secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# The Rust tests are not repeated here; the CI workflow runs them for the same commit.
#
# Only Windows is built for now. The other platforms come back one at a time, each as a job
# after this one that adds its files to the release it published.
#
# The Rust builds are not cached: a tag's run can read only caches saved by that tag or by
# main, so a cache saved here was never used again and only pushed main's out.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # The exe built here gets signed, so every action is pinned to a commit: a moved tag
      # in someone else's repository must not be able to change what is signed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # The app compares the tag with the version compiled into it, so they must agree.
      # The version is in Cargo.toml only; Tauri takes it from there.
      - name: Check that the tag matches the version in Cargo.toml
        id: version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$cargo" -ne $env:TAG) { throw "Tag $env:TAG and the version $cargo in Cargo.toml must agree." }
          "version=$cargo" >> $env:GITHUB_OUTPUT

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run tauri build -- --no-bundle

      # The licences of what is built into the exe, for the zip: the crates through
      # cargo-about (settings in src-tauri/about.toml), then the frontend packages that end
      # up in the bundle. A crate under a licence about.toml does not accept fails here.
      # cargo-about is the released binary rather than built from source, which took minutes;
      # it runs beside the exe before it is signed, so the download is checked against a
      # known hash.
      - name: Collect third-party licences
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $about = "cargo-about-0.9.2-x86_64-pc-windows-msvc"
          gh release download 0.9.2 --repo EmbarkStudios/cargo-about --pattern "$about.tar.gz"
          if ((Get-FileHash "$about.tar.gz").Hash -ne "1C03E5890238562497C2D89A3B75B02560AF349C1FC3E713D3284F532A5CD748") {
            throw "The cargo-about download does not match its known hash."
          }
          tar -xzf "$about.tar.gz"
          $env:PATH = "$PWD/$about;$env:PATH"
          cargo about generate --locked --manifest-path src-tauri/Cargo.toml -c src-tauri/about.toml src-tauri/about.hbs -o THIRD-PARTY-LICENSES.txt
          if ($LASTEXITCODE) { throw "cargo-about failed." }
          $frontend = [ordered]@{
            "svelte" = "LICENSE.md"; "@sveltejs/kit" = "LICENSE"; "uplot" = "LICENSE"; "@tauri-apps/api" = "LICENSE-MIT"
          }
          foreach ($package in $frontend.Keys) {
            $text = Get-Content -Raw "node_modules/$package/$($frontend[$package])"
            Add-Content THIRD-PARTY-LICENSES.txt "$('=' * 80)`n$package`n`n$text`n"
          }

      # The version is written into the signature, and the app refuses a download whose
      # signed version is not the one the release claims. The password is always passed,
      # empty when the key has none, so the signer never stops to ask for it.
      - name: Sign the exe
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "The secret TAURI_SIGNING_PRIVATE_KEY is not set." }
          New-Item -ItemType Directory release | Out-Null
          Copy-Item src-tauri/target/release/traceplotter.exe release/TracePlotter.exe
          npm run tauri signer sign -- -p "$env:KEY_PASSWORD" --app-version $env:VERSION release/TracePlotter.exe
          if (-not (Test-Path release/TracePlotter.exe.sig)) { throw "Signing produced no signature." }
          # A zip for people who download by hand.
          Compress-Archive -Path release/TracePlotter.exe, README.md, LICENSE, THIRD-PARTY-LICENSES.txt -DestinationPath "release/TracePlotter-$env:TAG-windows-x64.zip"

      # The release is made only here, with the exe already in it, so "latest release" never
      # points at a release the app cannot update from.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG release/TracePlotter.exe release/TracePlotter.exe.sig "release/TracePlotter-$env:TAG-windows-x64.zip" --verify-tag --title "TracePlotter $($env:TAG.TrimStart('v'))" --generate-notes --repo $env:GITHUB_REPOSITORY
