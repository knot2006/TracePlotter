# Weekly dependency update pull requests.
# Version updates wait until a release is at least three days old.
# Security updates bypass this cooldown.
# Minor and patch updates of one ecosystem come as a single pull request; a new major
# version gets its own, because it may need code changes.
version: 2
updates:
  # The workflows' actions, which are pinned to commits.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # Native interface, storage readers and trippy-core. trippy-core has no upper bound, so its
  # new releases arrive here too; one that changes the API fails CI until our code is fixed.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
