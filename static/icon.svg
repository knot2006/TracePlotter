<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background tile gradient -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Blue telemetry fill: lit at the top, fading into the tile -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f8fe0" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#1f5fa8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1b3f7a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Route gradient: Cyan -> Green -> Orange -> Dark Red peak -> Sky Blue -->
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="21%" stop-color="#00d2ff" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="81%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Dark halo hugging the line and nodes, plus a soft shadow underneath -->
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="8" result="halo" />
      <feGaussianBlur in="halo" stdDeviation="6" />
      <feOffset dy="5" />
      <feComponentTransfer result="shadow">
        <feFuncA type="linear" slope="0.8" />
      </feComponentTransfer>
      <feFlood flood-color="#070b16" />
      <feComposite in2="halo" operator="in" result="outline" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="outline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer navy rim -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="#1b2a6b" />

  <!-- App Tile Base with blue border -->
  <rect x="26" y="26" width="460" height="460" rx="94" fill="url(#tileBg)" stroke="#2b8fe6" stroke-width="8" />

  <!-- Horizontal dashed grid lines -->
  <line x1="96" y1="170" x2="416" y2="170" stroke="#2a4f9c" stroke-width="2.5" stroke-dasharray="6 6" />
  <line x1="96" y1="240" x2="416" y2="240" stroke="#2a4f9c" stroke-width="2.5" stroke-dasharray="6 6" />
  <line x1="96" y1="310" x2="416" y2="310" stroke="#2a4f9c" stroke-width="2.5" stroke-dasharray="6 6" />
  <line x1="96" y1="380" x2="416" y2="380" stroke="#2a4f9c" stroke-width="2.5" stroke-dasharray="6 6" />

  <!-- Vertical dashed grid lines -->
  <line x1="164" y1="110" x2="164" y2="410" stroke="#2a4f9c" stroke-width="2.5" stroke-dasharray="6 6" />
  <line x1="224" y1="110" x2="224" y2="410" stroke="#2a4f9c" stroke-width="2.5" stroke-dasharray="6 6" />
  <line x1="288" y1="110" x2="288" y2="410" stroke="#2a4f9c" stroke-width="2.5" stroke-dasharray="6 6" />
  <line x1="352" y1="110" x2="352" y2="410" stroke="#2a4f9c" stroke-width="2.5" stroke-dasharray="6 6" />

  <!-- Shaded telemetry area, directly under the route -->
  <path d="M 100 340 L 164 308 L 224 328 L 288 204 L 352 176 L 412 260 L 412 396 L 100 396 Z" fill="url(#areaGrad)" />

  <!-- Bottom baseline -->
  <line x1="96" y1="410" x2="416" y2="410" stroke="#f1f5f9" stroke-width="8" stroke-linecap="round" />

  <!-- Telemetry route & nodes grouped with halo + shadow -->
  <g filter="url(#softShadow)">
    <!-- Main telemetry line -->
    <path d="M 100 340 L 164 308 L 224 328 L 288 204 L 352 176 L 412 260" fill="none" stroke="url(#routeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Hop 1: Cyan -->
    <circle cx="100" cy="340" r="18" fill="#0a0f1d" stroke="#00d2ff" stroke-width="11" />

    <!-- Hop 2: Cyan -->
    <circle cx="164" cy="308" r="18" fill="#0a0f1d" stroke="#00d2ff" stroke-width="11" />

    <!-- Hop 3: Green -->
    <circle cx="224" cy="328" r="18" fill="#0a0f1d" stroke="#22c55e" stroke-width="11" />

    <!-- Hop 4: Orange -->
    <circle cx="288" cy="204" r="18" fill="#0a0f1d" stroke="#f97316" stroke-width="11" />

    <!-- Hop 5 (Peak): Dark Red ring with hollow dark center -->
    <circle cx="352" cy="176" r="18" fill="#0a0f1d" stroke="#b91c1c" stroke-width="11" />

    <!-- Hop 6 (Destination): Sky Blue -->
    <circle cx="412" cy="260" r="18" fill="#0a0f1d" stroke="#38bdf8" stroke-width="11" />
  </g>
</svg>
