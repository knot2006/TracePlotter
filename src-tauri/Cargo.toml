[package]
name = "traceplotter"
version = "0.1.0"
description = "Open-source visual traceroute and ping monitor"
license = "Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "traceplotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# API is documented as unstable, keep the exact pin.
trippy-core = "=0.13.0"
dns-lookup = "3"
tauri-plugin-notification = "2"
serde_json = "1"
tauri-plugin-dialog = "2"
ureq = { version = "2", features = ["json"] }
minisign-verify = "0.2"
base64 = "0.22"

# No `panic = "abort"`: stopping a trace unwinds out of trippy-core (see lib.rs).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
