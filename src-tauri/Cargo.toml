[package]
name = "traceplotter"
version = "0.1.3"
description = "Open-source visual traceroute and ping monitor"
license = "Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "traceplotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Not capped: new releases, breaking ones included, are taken and our code is fixed when
# the API changes. Cargo.lock keeps builds on the tested version until then.
trippy-core = ">=0.13"
tauri-plugin-notification = "2"
serde_json = "1"
tauri-plugin-dialog = "2"
ureq = { version = "3", features = ["json"] }
minisign-verify = "0.3"
base64 = "0.23"

[target.'cfg(not(windows))'.dependencies]
dns-lookup = "4"

# The Windows ICMP API, for ICMP traces that need no raw socket (see winicmp.rs), and
# reverse DNS without NetBIOS.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

# No `panic = "abort"`: stopping a trace unwinds out of trippy-core (see lib.rs).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
