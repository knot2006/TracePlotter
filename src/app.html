<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TracePlotter</title>
    <style>
      /* No page margin: the browser then has no room for its date, title and URL lines.
         The printed page gets its margin from body padding instead. */
      @page {
        size: landscape;
        margin: 0;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
