# Temporary: builds the Linux packages on a pull request to test scripts/package-linux.sh.
name: Package test
on: pull_request
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libfuse2 patchelf rpm
      - run: cargo build --release --locked
      - run: bash scripts/package-linux.sh
      - run: bash scripts/package-appimage.sh v0.2.0
      - run: |
          cd target/release/bundle
          ls -l deb rpm appimage
          dpkg-deb --info deb/*.deb
          dpkg-deb --contents deb/*.deb
          rpm -qip rpm/*.rpm
          rpm -qlp rpm/*.rpm
          rpm -qp --requires rpm/*.rpm
          rpm -qp --scripts rpm/*.rpm
