[package]
name = "traceplotter"
version = "0.2.0"
description = "Open-source visual traceroute and ping monitor"
license = "Apache-2.0"
repository = "https://github.com/knot2006/TracePlotter"
edition = "2024"
rust-version = "1.95"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "traceplotter_lib"

[features]
dev-live = ["dep:blaze-live"]
ui-tests = ["dep:egui_kittest"]

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
rusty-leveldb = "4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
# Not capped: new releases, breaking ones included, are taken and our code is fixed when
# the API changes. Cargo.lock keeps builds on the tested version until then.
trippy-core = ">=0.13"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
minisign-verify = "0.3"
base64 = "0.23"
# A small HTTP server for the MCP server (see mcp.rs).
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
egui_extras = { version = "0.37", default-features = false }
egui_plot = { version = "0.38" }
# The window's handle, for the blur behind Glass (see native/blur.rs).
raw-window-handle = "0.6"
rfd = { version = "0.17" }
arboard = { version = "3.6", features = ["wayland-data-control"] }
chrono = { version = "0.4", features = ["unstable-locales"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pdf-writer = { version = "0.15" }
notify-rust = { version = "4" }
miniz_oxide = { version = "0.9" }
# The native interface's tray icon, for monitoring with the window hidden (see native/tray.rs).
# On Linux it speaks StatusNotifierItem over D-Bus from its own thread, without GTK or libxdo.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
blaze-live = { path = "vendor/blaze-live", optional = true }

egui_kittest = { version = "0.37", features = ["eframe", "wgpu"], optional = true }

[target.'cfg(not(windows))'.dependencies]
dns-lookup = "4"

# Ping sockets, for ICMP traces that need no raw socket (see pingsock.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The blur behind Glass's translucent window on Wayland (see native/blur.rs).
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

# The Windows ICMP API, for ICMP traces that need no raw socket (see winicmp.rs), and
# reverse DNS without NetBIOS. Also the check for Administrator rights and the restart with them.
[target.'cfg(windows)'.dependencies]
# Start at sign-in, keeping the registration used by earlier releases.
auto-launch = { version = "0.6" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
] }

# No `panic = "abort"`: stopping a trace unwinds out of trippy-core (see lib.rs).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# For local test builds: compiles on all cores. Published builds use `release`.
[profile.fast]
inherits = "release"
codegen-units = 16
# Avoid cross-crate LTO and reuse compiled code between local builds.
lto = false
incremental = true

# Incremental BeautifulRust checks for this desktop application.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
[lints.clippy]
dbg_macro = "warn"
todo = "warn"

# egui-winit with one change: windows are made without a GDI redirection surface, which
# screenshots would otherwise show over Glass (see vendor/egui-winit/VENDORED.md).
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
